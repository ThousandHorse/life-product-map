<!-- Pane 1: NavPane
     仕様書準拠構造:
       ヘッダー（アプリ名のみ）
       ├─ モード切替セクション（目標 🎯 / 勤怠 🕐）
       └─ 年目標セクション（目標モード時のみ、最大5件）
-->
<aside class="sidebar">

  <!-- Header: アプリ名のみ（折りたたみボタンなし） -->
  <div class="sidebar-header">
    <div class="app-title">LifeProductMap</div>
  </div>

  <!-- Nav -->
  <nav class="sidebar-nav">

    <!-- モード切替セクション -->
    <div class="nav-section-label">モード</div>
    <div class="nav-mode-list">
      <!-- 目標モード -->
      <div class="mode-item active" id="mode-goal" onclick="setMode('goal')">
        <span class="mode-icon">🎯</span>
        <span class="mode-label">目標</span>
      </div>
      <!-- 勤怠モード -->
      <div class="mode-item" id="mode-attendance" onclick="setMode('attendance')">
        <span class="mode-icon">🕐</span>
        <span class="mode-label">勤怠</span>
      </div>
    </div>

    <div class="nav-divider"></div>

    <!-- 年目標セクション（目標モード時のみ表示） -->
    <div id="goals-section">
      <div class="nav-goals-header">
        <span class="nav-section-label" style="margin-bottom:0;">年目標</span>
        <button class="nav-add-btn" onclick="event.stopPropagation()" title="年目標を追加（最大5件）">+</button>
      </div>
      <div class="nav-goals">
        <div class="goal-item active" onclick="selectGoal(this)">
          <span class="goal-arrow">▶</span>
          <span class="goal-item-text">TOEIC 900点取得</span>
          <span class="goal-item-menu">…</span>
        </div>
        <div class="goal-item" onclick="selectGoal(this)">
          <span class="goal-arrow">▶</span>
          <span class="goal-item-text">副業月収10万円</span>
          <span class="goal-item-menu">…</span>
        </div>
        <div class="goal-item" onclick="selectGoal(this)">
          <span class="goal-arrow">▶</span>
          <span class="goal-item-text">体重65kg以下</span>
          <span class="goal-item-menu">…</span>
        </div>
      </div>
    </div>

  </nav>
</aside>
