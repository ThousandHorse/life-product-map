<!-- Pane 2: 勤怠モード – 打刻 & 累計
     render.js の renderAttendancePane2() がデータを埋める
-->
<div class="pane-body">

  <div class="card att-today-card">
    <div class="att-date-label" style="font-size:13px; color:var(--muted);"></div>

    <div class="clock-btn-row">
      <button class="clock-btn clock-btn-in">出勤</button>
      <button class="clock-btn clock-btn-out" onclick="openWorkLogDialog()">退勤</button>
    </div>

    <div class="divider"></div>

    <div class="att-row">
      <span class="att-row-label">出勤時刻</span>
      <span class="att-row-value att-clockIn-value"></span>
    </div>
    <div class="att-row">
      <span class="att-row-label">退勤時刻</span>
      <span class="att-row-value att-clockOut-value"></span>
    </div>
    <div class="att-row">
      <span class="att-row-label">稼働時間</span>
      <span class="att-row-value att-worked-value"></span>
    </div>
  </div>

  <div class="card">
    <div class="att-total-label">今月累計</div>
    <div class="att-total-value"></div>
    <div style="margin-top:10px;">
      <div class="progress-bar-bg" style="height:8px;">
        <div class="progress-bar-fill att-month-bar" style="width:0%;"></div>
      </div>
      <div class="att-progress-meta">
        <span class="att-target-label"></span>
        <span class="att-progress-pct"></span>
      </div>
    </div>
  </div>

</div>
