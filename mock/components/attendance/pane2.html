<!-- Pane 2: 勤怠モード – 打刻 & 累計
     退勤ボタン押下時に作業内容入力ダイアログを表示する
-->
<div class="pane-body">

  <div class="card att-today-card">
    <div style="font-size:13px; color:var(--muted);">2026年5月17日（土）</div>

    <div class="clock-btn-row">
      <button class="clock-btn clock-btn-in">出勤</button>
      <button class="clock-btn clock-btn-out" onclick="openWorkLogDialog()">退勤</button>
    </div>

    <div class="divider"></div>

    <div class="att-row">
      <span class="att-row-label">出勤時刻</span>
      <span class="att-row-value">09:12</span>
    </div>
    <div class="att-row">
      <span class="att-row-label">退勤時刻</span>
      <span class="att-row-value">—</span>
    </div>
    <div class="att-row">
      <span class="att-row-label">稼働時間</span>
      <span class="att-row-value">4h 23m</span>
    </div>
  </div>

  <div class="card">
    <div class="att-total-label">今月累計</div>
    <div class="att-total-value">72h</div>
    <div style="margin-top:10px;">
      <div class="progress-bar-bg" style="height:8px;">
        <div class="progress-bar-fill" style="width:60%;"></div>
      </div>
      <div class="att-progress-meta">
        <span>目標 120h</span>
        <span>60%</span>
      </div>
    </div>
  </div>

</div>
