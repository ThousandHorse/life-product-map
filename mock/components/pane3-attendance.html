<!-- Pane 3: 勤怠モード – Calendar & Weekly Graph -->
<div class="pane-header">CALENDAR & TIMELINE</div>
<div class="pane-body">

  <!-- Month navigation -->
  <div class="cal-nav">
    <div class="cal-nav-title">2026年5月</div>
    <div class="cal-nav-btns">
      <button class="cal-nav-btn">‹</button>
      <button class="cal-nav-btn">›</button>
    </div>
  </div>

  <!-- Calendar grid -->
  <div class="card" style="padding:16px;">
    <div class="calendar-grid">
      <!-- Day labels -->
      <div class="cal-day-label">SUN</div>
      <div class="cal-day-label">MON</div>
      <div class="cal-day-label">TUE</div>
      <div class="cal-day-label">WED</div>
      <div class="cal-day-label">THU</div>
      <div class="cal-day-label">FRI</div>
      <div class="cal-day-label">SAT</div>
      <!-- Week 1 -->
      <div class="cal-day"></div>
      <div class="cal-day"></div>
      <div class="cal-day"></div>
      <div class="cal-day"></div>
      <div class="cal-day has-record"><span class="cal-day-num">1</span><span class="cal-day-dot"></span></div>
      <div class="cal-day has-record"><span class="cal-day-num">2</span><span class="cal-day-dot"></span></div>
      <div class="cal-day"><span class="cal-day-num">3</span></div>
      <!-- Week 2 -->
      <div class="cal-day"><span class="cal-day-num">4</span></div>
      <div class="cal-day has-record"><span class="cal-day-num">5</span><span class="cal-day-dot"></span></div>
      <div class="cal-day has-record"><span class="cal-day-num">6</span><span class="cal-day-dot"></span></div>
      <div class="cal-day has-record"><span class="cal-day-num">7</span><span class="cal-day-dot"></span></div>
      <div class="cal-day has-record"><span class="cal-day-num">8</span><span class="cal-day-dot"></span></div>
      <div class="cal-day has-record"><span class="cal-day-num">9</span><span class="cal-day-dot"></span></div>
      <div class="cal-day"><span class="cal-day-num">10</span></div>
      <!-- Week 3 -->
      <div class="cal-day"><span class="cal-day-num">11</span></div>
      <div class="cal-day has-record"><span class="cal-day-num">12</span><span class="cal-day-dot"></span></div>
      <div class="cal-day has-record"><span class="cal-day-num">13</span><span class="cal-day-dot"></span></div>
      <div class="cal-day has-record"><span class="cal-day-num">14</span><span class="cal-day-dot"></span></div>
      <div class="cal-day has-record"><span class="cal-day-num">15</span><span class="cal-day-dot"></span></div>
      <div class="cal-day has-record"><span class="cal-day-num">16</span><span class="cal-day-dot"></span></div>
      <div class="cal-day"><span class="cal-day-num">17</span></div>
      <!-- Week 4 -->
      <div class="cal-day today"><span class="cal-day-num">18</span><span class="cal-day-dot"></span></div>
      <div class="cal-day"><span class="cal-day-num">19</span></div>
      <div class="cal-day"><span class="cal-day-num">20</span></div>
      <div class="cal-day"><span class="cal-day-num">21</span></div>
      <div class="cal-day"><span class="cal-day-num">22</span></div>
      <div class="cal-day"><span class="cal-day-num">23</span></div>
      <div class="cal-day"><span class="cal-day-num">24</span></div>
    </div>
  </div>

  <!-- Weekly bar graph -->
  <div>
    <div class="section-title" style="margin-bottom:12px;">今週の稼働</div>
    <div class="card" style="padding:16px 20px;">
      <div class="week-graph">
        <div class="week-bar-wrap">
          <div class="week-bar" style="height:55%;"></div>
          <div class="week-bar-label">月</div>
        </div>
        <div class="week-bar-wrap">
          <div class="week-bar" style="height:80%;"></div>
          <div class="week-bar-label">火</div>
        </div>
        <div class="week-bar-wrap">
          <div class="week-bar" style="height:70%;"></div>
          <div class="week-bar-label">水</div>
        </div>
        <div class="week-bar-wrap">
          <div class="week-bar" style="height:90%;"></div>
          <div class="week-bar-label">木</div>
        </div>
        <div class="week-bar-wrap">
          <div class="week-bar" style="height:40%;"></div>
          <div class="week-bar-label">金</div>
        </div>
        <div class="week-bar-wrap">
          <div class="week-bar" style="height:0%;"></div>
          <div class="week-bar-label">土</div>
        </div>
        <div class="week-bar-wrap">
          <div class="week-bar" style="height:10%; opacity:0.4;"></div>
          <div class="week-bar-label">日</div>
        </div>
      </div>
    </div>
  </div>

</div>
