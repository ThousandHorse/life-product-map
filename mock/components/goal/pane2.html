<!-- Pane 2: 目標モード – Month Milestone & Task List -->
<div class="pane-header">MONTH MILESTONE</div>
<div class="pane-body">

  <div>
    <div class="pane2-label">選択中の目標</div>
    <div class="pane2-month">TOEIC 900点取得</div>
  </div>

  <!-- task: high -->
  <div class="card task-card">
    <div class="task-card-top">
      <div class="task-title">英単語を毎日30分</div>
      <span class="task-badge badge-high">HIGH</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" style="width:70%;"></div>
    </div>
  </div>

  <!-- task: mid -->
  <div class="card task-card">
    <div class="task-card-top">
      <div class="task-title">リスニング問題50問</div>
      <span class="task-badge badge-mid">MID</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" style="width:45%;"></div>
    </div>
  </div>

  <!-- task: done -->
  <div class="card task-card task-done">
    <div class="task-card-top">
      <div class="task-title">模擬テスト受験</div>
      <span class="task-badge badge-done">DONE</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" style="width:100%;"></div>
    </div>
  </div>

  <button class="add-task-btn">+ タスクを追加</button>
</div>
