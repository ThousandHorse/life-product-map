  <div>
    <div class="section-title progress-section-title" style="margin-bottom:12px;">今週の進捗</div>
    <div class="progress-chart-card">
      <div class="donut-layout">

        <!-- ドーナツグラフ -->
        <div class="donut-wrap">
          <!--
            circle: r=44, 周長 = 2π×44 ≈ 276.5
            完了率 68% → 塗り = 276.5 × 0.68 ≈ 188
            stroke-dasharray="188 276.5"
            開始位置を12時に合わせるため rotate(-90)
          -->
          <svg class="donut-svg" viewBox="0 0 100 100">
            <!-- 背景トラック -->
            <circle cx="50" cy="50" r="44"
              fill="none"
              stroke-width="10"
              class="donut-track" />
            <!-- 達成分 -->
            <circle cx="50" cy="50" r="44"
              fill="none"
              stroke-width="10"
              stroke-linecap="round"
              stroke-dasharray="188 276.5"
              transform="rotate(-90 50 50)"
              class="donut-fill" />
            <!-- 中央テキスト -->
            <text x="50" y="42" class="donut-pct-main">68%</text>
            <text x="50" y="66" class="donut-pct-sub">完了</text>
          </svg>
        </div>
