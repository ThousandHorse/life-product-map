<!-- Pane 3: 目標モード – Detail View -->
<div class="pane-body">

  <div class="detail-title">TOEIC 900点取得</div>

  <div class="stat-row">
    <div class="stat-card">
      <div class="stat-label">進捗メモ</div>
      <div class="stat-value" style="font-size:18px; margin-top:4px; font-weight:600;">スコア 780</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">達成率</div>
      <div class="stat-value">68%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">残日数</div>
      <div class="stat-value">228</div>
    </div>
  </div>

  <!-- Progress Graph: 週次タスク達成率 + 目標ライン -->
  <div>
    <div class="section-title" style="margin-bottom:12px;">PROGRESS</div>
    <div class="progress-chart-card">
      <!-- SVG は固定サイズ。preserveAspectRatio を xMidYMid meet にして縦横比を保持 -->
      <svg class="progress-chart-svg" viewBox="0 0 320 130" preserveAspectRatio="xMidYMid meet">
        <!--
          描画エリア: x=36〜320, y=8〜96 (高さ88px)
          100% → y=8, 0% → y=96, グリッド間隔 = 88 * 0.25 = 22px
        -->

        <!-- グリッドライン & Y軸ラベル -->
        <line x1="36" y1="8"  x2="316" y2="8"  class="chart-grid" />
        <line x1="36" y1="30" x2="316" y2="30" class="chart-grid" />
        <line x1="36" y1="52" x2="316" y2="52" class="chart-grid" />
        <line x1="36" y1="74" x2="316" y2="74" class="chart-grid" />
        <line x1="36" y1="96" x2="316" y2="96" class="chart-grid" />
        <text x="30" y="11"  class="chart-label" text-anchor="end">100%</text>
        <text x="30" y="33"  class="chart-label" text-anchor="end">75%</text>
        <text x="30" y="55"  class="chart-label" text-anchor="end">50%</text>
        <text x="30" y="77"  class="chart-label" text-anchor="end">25%</text>
        <text x="30" y="99"  class="chart-label" text-anchor="end">0%</text>

        <!-- 目標ライン: 70% → y = 96 - 88*0.70 = 96-61.6 = 34.4 -->
        <line x1="36" y1="34.4" x2="316" y2="34.4" class="chart-target-line" />
        <text x="318" y="32" class="chart-target-label">目標</text>

        <!--
          棒グラフ: W1〜W5
          バー幅=36px, 間隔=56px, 開始x=54
          y = 96 - 88 * rate
          W1:80% → h=70.4, y=25.6
          W2:60% → h=52.8, y=43.2
          W3:90% → h=79.2, y=16.8  (最高)
          W4:45% → h=39.6, y=56.4
          W5:68% → h=59.8, y=36.2  (今週)
        -->
        <rect x="54"  y="25.6" width="36" height="70.4" rx="5" class="chart-bar" />
        <text x="72"  y="112"  class="chart-week-label">W1</text>
        <text x="72"  y="21"   class="chart-bar-pct">80%</text>

        <rect x="110" y="43.2" width="36" height="52.8" rx="5" class="chart-bar" />
        <text x="128" y="112"  class="chart-week-label">W2</text>
        <text x="128" y="39"   class="chart-bar-pct">60%</text>

        <rect x="166" y="16.8" width="36" height="79.2" rx="5" class="chart-bar chart-bar-best" />
        <text x="184" y="112"  class="chart-week-label">W3</text>
        <text x="184" y="12"   class="chart-bar-pct chart-bar-pct-best">90%</text>

        <rect x="222" y="56.4" width="36" height="39.6" rx="5" class="chart-bar" />
        <text x="240" y="112"  class="chart-week-label">W4</text>
        <text x="240" y="52"   class="chart-bar-pct">45%</text>

        <rect x="278" y="36.2" width="36" height="59.8" rx="5" class="chart-bar chart-bar-current" />
        <text x="296" y="112"  class="chart-week-label">今週</text>
        <text x="296" y="32"   class="chart-bar-pct chart-bar-pct-current">68%</text>
      </svg>

      <div class="progress-chart-legend">
        <span class="legend-item"><span class="legend-dot legend-dot-best"></span>最高週</span>
        <span class="legend-item"><span class="legend-dot legend-dot-current"></span>今週</span>
        <span class="legend-item"><span class="legend-line-target"></span>目標(70%)</span>
      </div>
    </div>
  </div>

  <div>
    <div class="section-title" style="margin-bottom:10px;">TODAY'S TASKS</div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <div class="card" style="display:flex; align-items:center; gap:12px; padding:14px 18px;">
        <input type="checkbox" style="width:16px; height:16px; accent-color:var(--primary);" />
        <span style="font-size:14px;">英単語 30分（Unit 12〜14）</span>
      </div>
      <div class="card" style="display:flex; align-items:center; gap:12px; padding:14px 18px;">
        <input type="checkbox" style="width:16px; height:16px; accent-color:var(--primary);" />
        <span style="font-size:14px;">リスニング問題 20問</span>
      </div>
    </div>
  </div>

</div>
