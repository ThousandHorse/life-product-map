<!-- Pane 3: 目標モード – Detail View -->
<div class="pane-body">

  <div class="detail-title"></div>

  <!-- 統計カード行: 達成率（ステータス統合）・残日数 -->
  <div class="stat-row">
    <div class="stat-card stat-card-achievement" id="stat-card-achievement">
      <div class="stat-label">達成率</div>
      <div class="stat-card-inner">
        <div class="stat-value stat-achievementRate"></div>
        <div class="goal-status-icon" id="goal-status-icon"></div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-label">残日数</div>
      <div class="stat-value stat-daysLeft"></div>
    </div>
  </div>

  <!-- Progress: 今週のタスク完了率（ドーナツ円グラフ） -->
  <div>
    <div class="section-title progress-section-title" style="margin-bottom:12px;">今週の進捗</div>
    <div class="progress-chart-card">
      <div class="donut-layout">

        <!-- ドーナツグラフ: render.js が stroke-dasharray と中央テキストを更新する -->
        <div class="donut-wrap">
          <svg class="donut-svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="44"
              fill="none" stroke-width="10"
              class="donut-track" />
            <circle cx="50" cy="50" r="44"
              fill="none" stroke-width="10"
              stroke-linecap="round"
              stroke-dasharray="0 276.5"
              transform="rotate(-90 50 50)"
              class="donut-fill" />
            <!-- 中央: 完了率のみ（「完了」文言なし） -->
            <text x="50" y="54" class="donut-pct-main"></text>
          </svg>
        </div>

        <!-- 日別バー: render.js の renderGoalPane3() が生成する -->
        <div class="donut-detail">
          <div class="donut-day-list"></div>
        </div>

      </div>
    </div>
  </div>

  <div>
    <div class="section-title" style="margin-bottom:10px;">TODAY'S TASKS</div>
    <!-- render.js の renderGoalPane3() が生成する -->
    <div class="today-task-list" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>

</div>
